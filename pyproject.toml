[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "etl"
version = "1.0.0"
description = "ETL датасета Oil Pipeline Accidents: Google Drive -> проверки -> Parquet и PostgreSQL"
readme = "README.md"
requires-python = ">=3.9"
# только то, что нужно пакету etl
dependencies = [
    "pandas==2.2.3",
    "pyarrow==21.0.0",
    "gdown==5.2.0",
    "pandera==0.26.1",
    "SQLAlchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
# служебные библиотеки: тесты, линтер, ноутбук EDA (ДЗ №5–6) и скрэпинг (ДЗ №4)
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "ipykernel==6.29.5",
    "matplotlib==3.9.4",
    "seaborn==0.13.2",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
]

[project.scripts]
etl = "etl.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
